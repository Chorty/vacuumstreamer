# VacuumStreamer runtime switches
#
# Format: KEY=value, one per line; "#" starts a comment. Each switch is "on" or
# "off". A missing or invalid value uses the default shown here. Reboot the
# robot after changing a switch.
#
# Install this file once; later deployments must not overwrite it.

# Camera pipeline: the video_monitor capture hook and go2rtc (RTSP, WebRTC,
# microphone and two-way audio). Also controls the Valetudo video capability.
CAMERA=on

# When the camera captures video:
#   on_demand  start video_monitor when a viewer connects, stop it after
#              CAMERA_IDLE_SECONDS without one
#   always     keep video_monitor running
CAMERA_MODE=on_demand

# Seconds without a viewer before on_demand mode stops video_monitor (30-86400).
CAMERA_IDLE_SECONDS=180

# Require a username and password for go2rtc's API and RTSP from other devices.
# Requests from the robot itself are not challenged. Needs the files
# credentials/GO2RTC_USERNAME and credentials/GO2RTC_PASSWORD; see README.md.
CAMERA_LOGIN=off

# Valetudo text-to-speech capability.
TTS=on

# Valetudo floor (map slot) management capability.
MAP_MANAGEMENT=on

# HTTP bridge on port 6971 (tts_handler.sh) used by Home Assistant for audio,
# status, driving and cleaning commands. It has no login.
HTTP_BRIDGE=on

# Addresses allowed to use the HTTP bridge, separated by spaces or commas, for
# example the Home Assistant host. The robot itself is always allowed. "any"
# allows every client on the network. Takes effect without a reboot.
HTTP_BRIDGE_ALLOW=any
